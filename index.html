<style>

ion:step .25s alternate infinite}.jumping #girl{animation:none}.crab-body{animation:scuffle .65s ease-in-out infinite alternate}.second{animation-delay:-.65s}.claw{animation:clash .65s ease-in-out infinite alternate;transform-origin:22px -10px}.peace .crab-body,.peace .claw{animation:none}.water{animation:water 4s ease-in-out infinite alternate}.spark{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes step{to{transform:translateY(-5px) rotate(3deg)}}@keyframes scuffle{to{transform:translateX(8px) rotate(3deg)}}@keyframes clash{to{transform:rotate(-23deg)}}@keyframes water{to{opacity:.4}}@media(max-width:600px){main{padding:16px 10px}.chapter{display:none}.book{border-width:4px}.story{padding:18px}.choices{flex-direction:column}button{width:100%;font-size:14px}h2{font-size:18px}.scene-label{top:10px;left:10px;font-size:10px;padding:5px 9px}footer{font-size:10px}.restart{width:auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<main>
<header><div><div class="eyebrow">LITTLE RED · A MANGROVE TALE</div><h1>หนูน้อยหมวกแดงกับป่าโกงกาง</h1><p>ตะกร้าขนมหนึ่งใบ กับการผจญภัยเล็ก ๆ ของเรา</p></div><span class="chapter">บทที่ 01 &nbsp; สะพานที่หายไป</span></header>

</g></svg></div>
<section class="story" aria-label="เรื่องราวและตัวเลือก"><div class="speaker">หนูน้อยหมวกแดง</div><div aria-live="polite" aria-atomic="true"><h2 id="dialogue"></h2><p class="hint" id="hint"></p></div><div class="choices" id="choices"></div></section></div>
<footer><span>✧ นิทานที่เราเลือกทางเดินได้เอง · ฉากแรก</span><button class="restart" id="restart">↻ เริ่มเรื่องใหม่</button></footer>
</main>
<script>
const $=id=>document.getElementById(id);
let version=0, activeAnimation=null, state='choice';
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function show(text,hint,buttons){$('dialogue').textContent=text;$('hint').textContent=hint;$('choices').replaceChildren();buttons.forEach(([label,action],i)=>{const b=document.createElement('button');b.textContent=label;b.className=i===0?'primary':'';b.onclick=action;$('choices').append(b);});}
function focusChoice(){$('choices').querySelector('button')?.focus({preventScroll:true});}
function reset(){version++;activeAnimation?.cancel();activeAnimation=null;state='choice';$('actor').style.transform='translate(370px,330px)';$('actor').classList.remove('walking','jumping');$('crabs').setAttribute('visibility','hidden');$('crabs').classList.remove('peace');$('quarrel').setAttribute('visibility','visible');$('wet').setAttribute('visibility','hidden');$('location').textContent='🌿 ริมลำธารในป่าโกงกาง';$('sceneDesc').textContent='หนูน้อยถือกระเช้าขนมยืนทางซ้ายของสะพานไม้ขาด มีทางลาดไปยังหาดเลนด้านล่าง';show('“เอ๊ะ! สะพานขาด… เราจะไปทางไหนดีนะ?”','ช่วยหนูน้อยนำตะกร้าขนมไปหาคุณยาย เลือกเส้นทางได้เลย ไม่มีการจับเวลา',[['① กระโดดข้ามไป',()=>choose('jump')],['② เดินเลาะลงข้างล่าง',()=>choose('below')]]);}
async function move(points,duration,kind,token){$('actor').classList.add(kind);activeAnimation=$('actor').animate(points.map(([x,y])=>({transform:`translate(${x}px,${y}px)`})),{duration:reduced.matches?100:duration,easing:'linear',fill:'forwards'});try{await activeAnimation.finished;}catch{return false;}if(token!==version)return false;const [x,y]=points.at(-1);$('actor').style.transform=`translate(${x}px,${y}px)`;activeAnimation.cancel();activeAnimation=null;$('actor').classList.remove(kind);return true;}
async function choose(route){if(state!=='choice')return;state='moving';const token=version;show(route==='jump'?'“จับตะกร้าให้แน่น… ฮึบ!”':'“ค่อย ๆ เดินลงไป รองเท้าจะเปียกนิดหน่อยนะ”','หนูน้อยกำลังเดินทาง…',[]);
if(route==='jump'){if(!await move([[370,330],[412,330],[455,330]],650,'walking',token))return;if(!await move([[455,330],[487,279],[523,253],[559,251],[596,277],[634,330]],1100,'jumping',token))return;state='landed';$('sceneDesc').textContent='หนูน้อยกระโดดข้ามช่องสะพานและยืนอย่างปลอดภัยบนอีกฝั่ง';show('“เย้! ข้ามมาได้แล้ว ขนมก็ยังอยู่ครบ!”','รองเท้ายังแห้ง และทางไปหาคุณยายอยู่ข้างหน้า',[['เดินต่อไปตามทาง →',finishJump],['ลองเดินลงไปดูปู',()=>{reset();choose('below');}]]);
}else{if(!await move([[370,330],[322,359],[282,396],[321,430],[388,452],[457,473]],2400,'walking',token))return;$('wet').setAttribute('visibility','visible');$('crabs').setAttribute('visibility','visible');$('location').textContent='🦀 หาดเลนใต้สะพาน';$('sceneDesc').textContent='หนูน้อยรองเท้าเปียกอยู่ด้านล่าง เจอปูก้ามดาบสองตัวกำลังชูก้ามและต่อสู้กัน';state='crabs';show('“โอ๊ะ! ปูก้ามดาบสองตัวกำลังสู้กันอยู่!”','ก้ามโต ๆ ขยับไปมา กึก กัก! เราหยุดดูห่าง ๆ โดยไม่ไปรบกวนปูกันดีกว่า',[['หยุดดูปูจากตรงนี้',watchCrabs],['กลับไปลองกระโดด',reset]]);}focusChoice();}
async function finishJump(){if(state!=='landed')return;state='moving';const token=version;show('“คุณยายจ๋า หนูกำลังไปหาแล้ว!”','เดินต่อไปบนทางริมป่า…',[]);if(!await move([[634,330],[720,330],[805,324],[866,315]],1500,'walking',token))return;state='end';show('หนูน้อยเดินต่อพร้อมตะกร้าขนมและรอยยิ้ม','จบฉากแรก · เส้นทางสะพานแสนกล้า ลองอีกทางเพื่อพบเพื่อนตัวจิ๋วได้เลย',[['↻ เล่นฉากแรกอีกครั้ง',reset],['ลองเส้นทางปูก้ามดาบ',()=>{reset();choose('below');}]]);focusChoice();}
function watchCrabs(){if(state!=='crabs')return;state='observed';show('“ดูสิ! แต่ละตัวมีก้ามข้างหนึ่งใหญ่เบ้อเริ่มเลย”','หนูน้อยยืนดูอย่างเงียบ ๆ ปูทั้งสองค่อย ๆ หยุดประลองก้าม',[['ดูว่าจะเกิดอะไรขึ้นต่อ →',()=>{$('crabs').classList.add('peace');$('quarrel').setAttribute('visibility','hidden');state='end';show('“เลิกสู้กันแล้ว! บ๊ายบาย เจ้าปูตัวน้อย”','จบฉากแรก · เส้นทางนักสำรวจ รองเท้าเปียกนิดหน่อย แต่ได้พบเรื่องราวใหม่',[['↻ เล่นฉากแรกอีกครั้ง',reset],['ลองกระโดดข้ามสะพาน',()=>{reset();choose('jump');}]]);focusChoice();}]]);focusChoice();}
$('restart').onclick=()=>{reset();focusChoice();};reset();
</script>
